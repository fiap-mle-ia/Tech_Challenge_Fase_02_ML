[project]
name = "propensao-compra"
version = "0.1.0"
description = "Pipeline de ML para prever a propensão de compra de usuários de e-commerce (Tech Challenge Fase 2 - POSTECH)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Derek Seiji Lima Sadakane" },
    { name = "Gustavo Eidi Kono Masuno" },
    { name = "Jônatas Gomes Alves" },
    { name = "Leandro Kersting de Freitas" },
    { name = "Matheus de Souza Gonçalves" },
]
dependencies = [
    "dvc>=3.67.1,<4",
    "mlflow>=3.17.2,<4",
    "numpy>=2.5.4,<3",
    "pandas>=3.1.0,<4",
    "pydantic-settings>=2.16.2,<3",
    "pyyaml>=6.0.3,<7",
    "scikit-learn>=1.9.1,<2",
]

[tool.poetry]
packages = [{ include = "propensao_compra", from = "src" }]

[tool.poetry.group.dev.dependencies]
jupyter = ">=1.1.1"
matplotlib = ">=3.11.2"
pytest = ">=9.2.0"
pytest-cov = ">=7.1.0"
ruff = ">=0.17.3"
seaborn = ">=0.13.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: treina o modelo completo (pule com -m 'not slow')"]
