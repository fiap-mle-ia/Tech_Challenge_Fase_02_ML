name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Instala o Poetry
        run: pipx install poetry==2.5.1

      - name: Confere se o poetry.lock está sincronizado com o pyproject.toml
        run: poetry check --lock

      - name: Instala as dependências pelo poetry.lock
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Testes (pytest)
        run: poetry run pytest --cov=propensao_compra --cov-report=term-missing
