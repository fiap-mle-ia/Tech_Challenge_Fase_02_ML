line-length = 100
target-version = "py314"
extend-exclude = ["notebooks"]  # experimentação; o lint vale para src/ e tests/

[lint]
# E/F: erros básicos · I: imports · UP: sintaxe moderna · B: bugs comuns
# N: nomes (PEP 8) · ANN: type hints · D: docstrings · C90: complexidade · SIM: simplificações
select = ["E", "F", "I", "UP", "B", "N", "ANN", "D", "C90", "SIM"]
ignore = ["D100", "D104"]  # docstring de módulo/pacote fica opcional

[lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 8
